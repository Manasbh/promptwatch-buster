<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Visibility Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Tokens. The accent is "you": the brand's series color doubles as the UI accent, so wherever the
   eye lands on blue, it is looking at the tracked brand. Engines and rivals keep fixed series slots. */
:root {
  color-scheme: dark;
  --canvas: #0b0c0e; --panel: #111316; --lift: #171a1e; --well: #08090b;
  --ink: #eeeef0; --ink-2: #b4b5ba; --ink-3: #85868c; --ink-4: #5a5b61;
  --line: rgba(255,255,255,.07); --line-soft: rgba(255,255,255,.045); --line-strong: rgba(255,255,255,.13);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --other: #4a4a46; --you: var(--s1); --you-soft: rgba(57,135,229,.12); --you-line: rgba(57,135,229,.35);
  --good: #0ca30c; --warning: #c98500; --critical: #e66767; --up: #2fbf71; --down: #e66767;
  --shadow: none; --glow: 0 0 0 1px var(--line), 0 1px 0 rgba(255,255,255,.03) inset;
}
:root[data-theme="light"] {
  color-scheme: light;
  --canvas: #f5f5f3; --panel: #ffffff; --lift: #fafaf9; --well: #efefec;
  --ink: #0d0e10; --ink-2: #45464b; --ink-3: #75767c; --ink-4: #a4a5aa;
  --line: rgba(13,14,16,.09); --line-soft: rgba(13,14,16,.055); --line-strong: rgba(13,14,16,.16);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #c3c2b7; --you-soft: rgba(42,120,214,.08); --you-line: rgba(42,120,214,.3);
  --good: #0a8a0a; --warning: #b57a00; --critical: #d03b3b; --up: #067a3a; --down: #d03b3b;
  --shadow: 0 1px 2px rgba(13,14,16,.04), 0 2px 8px rgba(13,14,16,.03); --glow: 0 0 0 1px var(--line);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); }
body { font: 13.5px/1.5 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.mono, .num { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
a { color: var(--you); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; border-radius: 6px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 18px; }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px; font-weight: 650; letter-spacing: -.01em; }
.logo .m { width: 22px; height: 22px; border-radius: 6px; background: var(--you); display: grid; place-items: center; }
.logo .m svg { width: 14px; height: 14px; }
.logo small { display: block; font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: 0; }
.proj { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px; display: flex; gap: 10px; align-items: center; }
.proj .av { width: 30px; height: 30px; border-radius: 8px; background: var(--you-soft); color: var(--you); display: grid; place-items: center; font-weight: 700; flex: none; border: 1px solid var(--you-line); }
.proj b { display: block; font-weight: 600; } .proj span { color: var(--ink-3); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .h { font-size: 11px; color: var(--ink-4); font-weight: 500; padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .08em; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.nav a svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.nav a:hover { background: var(--line-soft); color: var(--ink); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--lift); color: var(--ink); box-shadow: var(--glow); }
.nav a[aria-current="page"] svg { color: var(--you); opacity: 1; }
.nav .cnt { margin-left: auto; font-size: 11px; color: var(--ink-3); background: var(--line-soft); border-radius: 999px; padding: 0 7px; }
.rail .foot { margin-top: auto; font-size: 11.5px; color: var(--ink-3); padding: 0 8px; display: grid; gap: 4px; }
.rail .foot .live { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.rail .foot .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }

main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--canvas) 85%, transparent); backdrop-filter: blur(10px); }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--ink-3); min-width: 0; white-space: nowrap; }
.crumb b { color: var(--ink); font-weight: 600; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pillx { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12px; color: var(--ink-2); background: var(--panel); white-space: nowrap; }
.pillx i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--lift); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-4); }
.btn.pri { background: var(--you); border-color: transparent; color: #fff; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.icon { padding: 5px 8px; }
.view { padding: 24px 28px 48px; max-width: 1400px; }
.view[hidden] { display: none; }
.vh { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.vh h1 { font-size: 22px; letter-spacing: -.02em; margin: 0; font-weight: 650; }
.vh p { margin: 4px 0 0; color: var(--ink-3); max-width: 720px; }

/* ---------- grid + cards ---------- */
.g { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; }
.c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flush { padding: 0; } .card.flush .ch { padding: 16px 18px 0; }
.ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.ch h3 { font-size: 13.5px; margin: 0; font-weight: 600; letter-spacing: -.005em; }
.ch p { margin: 2px 0 0; color: var(--ink-3); font-size: 12px; }
.lbl { font-size: 12px; color: var(--ink-3); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: -40% 40% auto -10%; height: 140%; background: radial-gradient(closest-side, var(--you-soft), transparent); pointer-events: none; }
.hero > * { position: relative; }
.big { font-size: 64px; font-weight: 650; letter-spacing: -.045em; line-height: 1; margin: 14px 0 6px; }
.big sup { font-size: 26px; letter-spacing: -.02em; color: var(--ink-3); vertical-align: 28px; margin-left: 2px; font-weight: 500; }
.hero .sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--ink-3); font-size: 12px; }
.rank { display: inline-flex; align-items: center; gap: 6px; background: var(--you-soft); color: var(--ink); border: 1px solid var(--you-line); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.delta { white-space: nowrap; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--ink-3); }
.ebreak { display: grid; gap: 12px; align-content: center; }
.erow { display: grid; grid-template-columns: 130px minmax(0, 1fr) 54px; align-items: center; gap: 12px; font-size: 12.5px; }
.erow .n { display: flex; align-items: center; gap: 7px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.erow .v { text-align: right; font-weight: 500; }
.ci { position: relative; height: 8px; border-radius: 4px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-soft); }
.ci .band { position: absolute; top: 0; bottom: 0; border-radius: 4px; opacity: .28; }
.ci .pt { position: absolute; top: -3px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; box-shadow: 0 0 0 2px var(--panel); }

/* kpi */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; margin-top: 6px; }
.kpi .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: auto; flex-wrap: wrap; }
.kpi .note { font-size: 11.5px; color: var(--ink-3); }
.spark { width: 96px; height: 30px; flex: none; overflow: visible; }

/* engine cards + run tape (signature: every individual run, lit when it named you) */
.eng .top2 { display: flex; justify-content: space-between; align-items: center; }
.eng .v { font-size: 34px; font-weight: 600; letter-spacing: -.035em; margin: 8px 0 2px; line-height: 1.05; }
.eng .rng { font-size: 11.5px; color: var(--ink-3); }
.tape { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 12px; }
.tape .p { display: flex; gap: 2px; }
.tape .t { width: 4px; height: 16px; border-radius: 1.5px; background: var(--line-strong); }
.mini3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.mini3 b { display: block; font-size: 15px; font-weight: 600; }
.mini3 span { font-size: 11.5px; color: var(--ink-3); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--ink-3); font-weight: 500; font-size: 11.5px; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--lift); }
th:first-child { border-top-left-radius: 0; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; overflow-wrap: anywhere; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--line-soft); }
td.r, th.r { text-align: right; }
tr.me td { background: var(--you-soft); } tr.me:hover td { background: var(--you-soft); }
tr.me td:first-child { box-shadow: inset 2px 0 0 var(--you); }
.card.flush .tw { margin-top: 14px; border-top: 1px solid var(--line); }
.card.flush table th:first-child, .card.flush table td:first-child { padding-left: 18px; }
.card.flush table th:last-child, .card.flush table td:last-child { padding-right: 18px; }
.meter { display: inline-flex; align-items: center; gap: 8px; min-width: 120px; }
.meter .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-soft); position: relative; overflow: hidden; min-width: 48px; }
.meter .bar b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ink-4); }
.meter .num { width: 36px; text-align: right; color: var(--ink-2); }
.bname { display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; }
.you-tag { font-size: 10.5px; font-weight: 600; color: var(--you); border: 1px solid var(--you-line); border-radius: 4px; padding: 0 5px; }
.rk { color: var(--ink-4); width: 28px; }
.dots3 { display: inline-flex; gap: 10px; }
.dots3 span { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.code { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--ink-4); }
.tag { display: inline-flex; font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); background: var(--lift); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; color: var(--ink-2); }
.st i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); }
.st.good i { background: var(--good); } .st.warn i { background: var(--warning); } .st.crit i { background: var(--critical); }

/* segmented + inputs */
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); background: var(--well); border-radius: 9px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-3); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--lift); color: var(--ink); box-shadow: var(--glow); }
.search { border: 1px solid var(--line); background: var(--well); border-radius: 9px; padding: 6px 10px; color: var(--ink); font: inherit; font-size: 12.5px; min-width: 220px; }
.search::placeholder { color: var(--ink-4); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* leaderboard extras + lists */
.blist { list-style: none; margin: 0; padding: 0; }
.blist li { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
.blist li:last-child { border-bottom: 0; }
.blist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.fav { width: 16px; height: 16px; border-radius: 4px; background: var(--lift); border: 1px solid var(--line); display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--ink-3); flex: none; text-transform: uppercase; }

/* actions */
.prog { display: flex; align-items: center; gap: 12px; min-width: 260px; }
.prog .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; display: flex; gap: 2px; }
.prog .bar b { display: block; height: 100%; }
.board { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.col { background: var(--well); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px; display: grid; gap: 10px; min-width: 0; }
.col .hd { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; font-weight: 600; font-size: 12.5px; }
.col .hd i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-4); }
.col.doing .hd i { background: var(--warning); } .col.done .hd i { background: var(--good); }
.col .hd span { color: var(--ink-3); font-weight: 500; }
.act { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: grid; gap: 6px; box-shadow: var(--shadow); transition: border-color .15s ease; }
.act:hover { border-color: var(--line-strong); }
.act .t { font-weight: 600; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.act .d { color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.act .d.open { -webkit-line-clamp: unset; }
.act .m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.act .f { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
.act .btn { padding: 3px 10px; font-size: 12px; }
.act.done .t { text-decoration: line-through; color: var(--ink-3); } .act.done .d { color: var(--ink-3); }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; margin-right: 2px; }
.sig b { width: 3px; border-radius: 1px; background: var(--line-strong); }
.sig b:nth-child(1) { height: 5px; } .sig b:nth-child(2) { height: 8px; } .sig b:nth-child(3) { height: 11px; }
.sig b.on { background: var(--ink-2); }
.src { font-size: 11px; color: var(--ink-4); }
.moves { display: grid; gap: 2px; }
.move { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 6px; border-radius: 8px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.move:last-child { border-bottom: 0; } .move:hover { background: var(--line-soft); }
.move .i { width: 22px; height: 22px; border-radius: 6px; background: var(--lift); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.move .t { font-weight: 550; font-size: 12.5px; line-height: 1.35; }
.move .m { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 11px; color: var(--ink-3); }

/* sov + dot-whisker */
.sovr { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; align-items: center; margin: 10px 0; font-size: 12.5px; }
.sovr .stack { display: flex; gap: 2px; height: 24px; }
.sovr .stack div { min-width: 2px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; color: #fff; overflow: hidden; font-family: "Geist Mono", monospace; }
.sovr .stack div:first-child { border-radius: 5px 0 0 5px; } .sovr .stack div:last-child { border-radius: 0 5px 5px 0; }
.sovr .stack div.dk { color: #0b0b0b; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dw { display: grid; grid-template-columns: 150px minmax(0, 1fr) 110px; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 8px; font-size: 12.5px; }
.dw:hover { background: var(--line-soft); }
.dw .track { position: relative; height: 18px; background: linear-gradient(to right, var(--line) 1px, transparent 1px) 0 0 / 25% 100%; border-right: 1px solid var(--line); }
.dw .wh { position: absolute; top: 8px; height: 2px; background: var(--ink-4); border-radius: 1px; }
.dw .dt { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--panel); }
.dw .v { text-align: right; color: var(--ink-2); }
.dw .v small { color: var(--ink-4); }
.axis { display: grid; grid-template-columns: 150px minmax(0, 1fr) 110px; gap: 12px; padding: 0 6px; font-size: 10.5px; color: var(--ink-4); }
.axis div { display: flex; justify-content: space-between; }

/* quotes, misc */
.quote { border: 1px solid var(--line); background: var(--lift); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; overflow-wrap: anywhere; font-size: 12.5px; color: var(--ink-2); }
.quote .s { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); margin-top: 8px; }
.empty { color: var(--ink-3); padding: 26px 12px; text-align: center; font-size: 12.5px; border: 1px dashed var(--line); border-radius: 10px; }
details { margin-top: 12px; } summary { cursor: pointer; color: var(--ink-3); font-size: 12px; }
svg text { fill: var(--ink-3); font-size: 11px; font-family: "Geist Mono", ui-monospace, monospace; }
.tip { position: fixed; pointer-events: none; z-index: 30; background: var(--lift); color: var(--ink); border: 1px solid var(--line-strong);
  border-radius: 9px; padding: 9px 11px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.28); max-width: 300px; display: none; }
.tip b { font-weight: 600; } .tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); } .tip .r b { color: var(--ink); }
.note { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

@media (max-width: 1180px) {
  .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } .c3 { grid-column: span 6; }
  .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 10px; }
  .rail .proj, .rail .foot, .nav .h { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .nav a { white-space: nowrap; }

    const quotes = L.excerpts.length ? L.excerpts.map(x => el("blockquote", { cls: "quote" }, el("div", { text: x.text }), el("div", { cls: "s" }, el("span", { cls: "sw", style: `background:${sv(ESLOT[x.engine])}` }), `${ENG[x.engine]} · ${x.pid}`)))
      : [empty("You weren't named in any answer.")];
    const repq = L.reputation.map(x => el("blockquote", { cls: "quote" }, el("div", { text: x.text }),
      el("div", { cls: "s" }, el("span", { cls: "sw", style: `background:${sv(ESLOT[x.engine])}` }), `${ENG[x.engine]} · “${x.prompt}”` + (x.sources.length ? " · sources: " + x.sources.join(", ") : ""))));
    const own = L.own_pages.length ? el("ul", { cls: "blist" }, L.own_pages.map(([u, n]) => el("li", null,
      el("span", { cls: "nm" }, safeUrl(u) ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: u.replace(/^https?:\/\/(www\.)?/, "") }) : u),
      meter(n / Math.max(1, ...L.own_pages.map(p => p[1])), "var(--you)")))) : empty("None of your pages were cited yet.");
    head("content", "Content", "What the engines search for and how they describe you. Matching titles and lead passages to these searches is the best-supported on-page lever.");
    views.content.append(el("div", { cls: "g" },
      card("flush c7", "ChatGPT's own searches", L.site_pages ? `Matched against ${L.site_pages.toLocaleString()} URLs in your sitemap.` : "Set sitemap in config.json to check coverage.", null, fan),
      card("c5", "Your pages that get cited", "Answers citing each URL.", null, own),
      card("c12", "How the engines describe you", "Check prices, features and claims. A wrong fact comes from a source you can fix.", null,
        el("div", { cls: "g" }, el("div", { cls: "c6" }, ...quotes), el("div", { cls: "c6" }, repq.length ? el("div", { cls: "lbl", style: "margin-bottom:10px", text: "Reputation prompts" }) : null, ...repq)))));
  })();

  // ---- routing ----
  function route() {
    const id = (location.hash || "#overview").slice(1), ok = views[id] ? id : "overview";
    VIEWS.forEach(([v, t]) => { views[v].hidden = v !== ok; if (v === ok) { crumbTitle.textContent = t; document.title = `${t} · ${B} · AI visibility`; }
      navLinks[v].toggleAttribute("aria-current", v === ok); if (v === ok) navLinks[v].setAttribute("aria-current", "page"); });
    hideTip(); window.scrollTo(0, 0);

  renderBoard(); renderMoves(); renderNavCounts();
  addEventListener("hashchange", route); route();
